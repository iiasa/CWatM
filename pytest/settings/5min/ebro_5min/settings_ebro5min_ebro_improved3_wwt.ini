[GROUNDWATER_MODFLOW]
#-------------------------------------------------------

#Executable Modflow file
#path_mf6dll = C:\nonGithub\Modflow6\mf6\win64
#path_mf6dll = P:\watmodel\Modflow\mf6
# MODFLOW 6.8.1 (2026): xmipy >= 1.3 needs get_value_ptr, not in libmf6 6.2.2 (2021) in mf6
path_mf6dll = P:/watmodel/Modflow/mf6_681
#path_mf6dll = P:\watmodel\Modflow\linux

# Path of Modflow input and output
#PathGroundwaterModflow = C:/Data/CWatM/Modflow/Saudi/1000m
PathGroundwaterModflow = P:/watmodel/CWATM/Regions/Danube/modflow/created_files/2500m
PathGroundwaterModflowOutput = $(PathGroundwaterModflow)/output
PathGroundwaterModflowInput = $(PathGroundwaterModflow)
#PathGroundwaterModflowInput = $(PathGroundwaterModflow)/500m

# write modflow eror to file
writeModflowError = True

##  --- Steady state begin -----------------------
# soil humidity should not be high when starting to avoid to much pumping demand at the begining (between 0 and 1, 0.75 seems nice)
start_soil_humid = 0.5
# load an initial water table (in meter)
load_init_water_table = False
# if False, initial_water_table_depth (in m) is used on all the grid
#initial_water_table_depth = $(PathGroundwaterModflowInput)/modflow_depth0_totalend.nc; $(PathGroundwaterModflowInput)/modflow_depth1_totalend.nc
initial_water_table_depth = 0
# if True, init_water_table is the initial water table file (2D numpy format (row, col))
init_water_table = P:/watmodel/CWATM/Regions/Danube/init/Danube_2500m_modflow_20000201.npy
#init_water_table = P:\watmodel\CWATM\Saudi_Arabia\init\Saudi_Arabia_modflow_20211231.npy
# Defining the upper limit of the groundwater layer
use_soildepth_as_GWtop = True
correct_soildepth_underlakes = False
depth_underlakes = 2

# Pumping file (a 3D numpy array where 1st dim is time, then, 1st col = ModFlow row index, 2nd col = ModFlow col index, 3rd col = pumping rates < 0 !!!! in m3/day)
Groundwater_pumping = True
# minimum saturated fraction of each ModFlow layer that is not pumped (0 - 0.98, default 0.7) - before 2026-10 the
# fraction of the full storage that could be used: converted to 1 - x (was 0.2)
water_table_limit_for_pumping = 0.8
#Updated from 0.5

#pump_location = 0;1

# Prefix of the modflow files
nameModflowModel = Danube_2500m
#ModFlow model's resolution [meter]
Modflow_resolution = 2500 

# timestep of every Modflow execution
modflow_timestep = 1

# MODFLOW input files in <PathGroundwaterModflowOutput>/wd are reused if all MODFLOW inputs are unchanged
# (checked with a hash in wd/input_hash; the initial head and the run length are not part of the files).
# False: always write them new
load_modflow_from_disk = True

# MODFLOW in a child process (default True): a MODFLOW error stops CWatM with Error 313 and the
# MODFLOW error report, instead of ending Python. False: MODFLOW in the CWatM process (as before 2026-10)
modflow_subprocess = True
# longest time in seconds for one MODFLOW call (start or one time step), else Error 315; 0: no limit
modflow_timeout = 3600
# MODFLOW input files: False (default) binary files *.bin (exact values, faster to write),
# True: text (readable, e.g. for checking the input)
modflow_text_input = False
# CWatM - ModFlow cell overlap: computed at the start from the CWatM mask and modflow_basin.tif
# (with their CRS; a MaskMap without CRS with lat/lon coordinates: EPSG:4326, else set cwatm_crs = EPSG:...)
# Number of layers
nlay = 1

