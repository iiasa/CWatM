# Settings for preprocess_modflow.py - test basin tisa1 (EU-DEM 100 m in ETRS89-LAEA, CWatM mask 1 arcmin lat/lon)
# Run: python preprocess_modflow.py preprocessing_tisa1.ini
# Relative paths are relative to this settings file

[PATHS]
# CWatM mask map (tif with CRS, or a file without CRS like PCRaster .map - then cwatm_epsg is used).
# Active cells: not nodata and not 0
cwatm_mask = tisa1/area_tisa1.tif
# fine DEM (tif with CRS, heights in m, nodata set in the file) - clipped with a margin of >= 2 MODFLOW cells
# around the CWatM mask. Used for the MODFLOW elevation and the river network
dem = tisa1/eudem100m_clip.tif
# output folder: the maps are written to <output_folder>/<res_modflow>m/, the finer maps to .../finer_<res_finer>m/
output_folder = tisa1/output

[GRID]
# EPSG code of the CWatM mask - only used if the mask file has no CRS (4326 = lat/lon WGS84)
cwatm_epsg = 4326
# EPSG code of the MODFLOW grid (metres): 3035 = ETRS89-LAEA (equal area, same CRS as the DEM - no reprojection
# of the DEM). Empty: UTM zone of the basin centre
modflow_epsg = 3035
# MODFLOW cell size [m]
res_modflow = 500
# cell size of the finer grid for the river network [m] - res_modflow has to be a whole multiple of it
# (here 500 / 100 = 5 x 5 finer cells per MODFLOW cell); best a multiple of the DEM resolution
res_finer = 100
# MODFLOW grid around the active CWatM cells only (active, smaller grid) or around the whole mask rectangle (full)
extent = active
# a MODFLOW cell is active (modflow_basin = 1) if more than this share of its area is inside the CWatM mask
# (0.5 = more than half; lower values give more cells at the border, higher values fewer)
basin_fraction = 0.5
# the share inside the CWatM mask is counted on a grid mask_subsampling x mask_subsampling times finer than
# MODFLOW (10 = 100 points per MODFLOW cell, share accurate to 1 %)
mask_subsampling = 10
# True: move the grid origin onto the DEM pixel grid, so each MODFLOW / finer cell contains whole DEM pixels
# (only if DEM and MODFLOW have the same CRS, otherwise ignored)
snap_to_dem = True

[RIVER]
# a finer cell is a river if its upstream area > stream_density^2 [m2] (1000 -> 1 km2). Lower values give a
# denser river network and a higher river percentage. Has to be >= res_finer
stream_density = 1000

[OPTIONS]
# True: show maps of the basin, elevation and river percentage at the end
plot = True

# optional: maps projected to the MODFLOW grid (average), written as <name>.tif - e.g. permeability, porosity
#[EXTRA_MAPS]
#permeability_modflow = tisa1/permeability.tif
#porosity_modflow = tisa1/porosity.tif
