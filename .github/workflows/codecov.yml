name: workflow uploading Codecov
# uploads pytest/coverage.xml of the pushed commit to Codecov (branch main or develop, taken from the push)
# coverage.xml is made locally: "pytest/▶️ pytest_cwatm*.bat" (pytest --cov=cwatm) + pytest/fix_coverage_paths.py
# (file paths cwatm/... relative to the repository root)
on:
  push:
    branches: [main, develop]
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./pytest/coverage.xml
          disable_search: true
          fail_ci_if_error: true
          flags: pytest
          name: cwatm-pytest
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
