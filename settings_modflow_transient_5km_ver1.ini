# Bagnold instream sediment processes
prf = 0.5113334576508559
csp = 0.05472415301936417
spexp = 1.6176751637277507

# values for lakes/reservoir deposition
d50_sediment = 20
ks_sediment = 0.184

channel_cover = 0.1478230006133814
