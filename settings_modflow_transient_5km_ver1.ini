[GROUNDWATER_MODFLOW]
#-------------------------------------------------------
# STEADY STATE RUN
run_only_steady_state = False

include_rch_drn_steady_state = True
longterm_recharge = $(PathGroundwaterModflow)/inputs/modf_in/longterm_daily_recharge_1965_2019_cwatm.tif

# for constant head -> set -9999 as NA
include_cosntant_head_steady_state = True
chd_boundary_map = $(PathGroundwaterModflow)/inputs/modf_in/constanthrad_lakes_cwatm.tif
chd_absolute = False

#-------------------------------------------------------
#Executable Modflow file

path_mf6dll = P:/watmodel/CWATM/model/cwatm_modflow_layers/mf6/win64

# Path of Modflow input and output 
PathGroundwaterModflow = P:/watmodel/CWATM/modelruns/uppernile_wmz_G4DR/
PathGroundwaterModflowOutput = $(FILE_PATHS:PathOut)

PathGroundwaterModflowInput = $(PathGroundwaterModflow)/inputs/modf_out_5km_elevPercent/5000.0m
PathGroundwaterModflowInputMaps = $(PathGroundwaterModflow)/inputs/modf_in/unwmz_conv

# write modflow eror to file - if True  prints to the cmd
writeModflowError = False

##  --- Global Modflow settings -----------------------
load_modflow_from_disk = False

# Prefix of the modflow files
nameModflowModel = UNWMZ_GW5000

#ModFlow model's resolution [meter]
Modflow_resolution = 5000 

# timestep of every Modflow execution
modflow_timestep = 1

##  --- Initial Conditions -----------------------
# load an initial water table (in meter)
load_init_water_table = True

# if False, initial_water_table_depth (in m) is used on all the grid
initial_water_table_depth = 1; 0.5

# if True, init_water_table is the initial water table file (2D numpy format (row, col))
init_water_table = p:/watmodel/cwatm//modelruns/uppernile_wmz_G4DR//modelruns_02102026/outputs/outputs_ver1/steady_state_equilibrium_heads.npy

# save an initial water table (in meter)
save_init_water_table = True

# soil humidity should not be high when starting to avoid to much pumping demand at the begining (between 0 and 1, 0.75 seems nice)
start_soil_humid = 0.75

##  --- CWATM-MODFLOW Coupling files -----------------------
# Data for specified resolution
cwatm_modflow_indices = $(PathGroundwaterModflowInput)/indices
modflow_basin = $(PathGroundwaterModflowInput)/modflow_basin.tif
topo_modflow = $(PathGroundwaterModflowInput)/elevation_modflow.tif
chanRatio = $(PathGroundwaterModflowInput)/modlfow_river_percentage.tif

##  --- Hydrogeology -----------------------
# Number of layers
nlay = 2

# Defining the upper limit of the groundwater layer
use_soildepth_as_GWtop = True
correct_soildepth_underlakes = True
depth_underlakes = 1.5

# Thickness (default = 400) otherwise use maps from Gleeson et al.
thickness = P:/watmodel/CWATM/model/cwatm_modflow_layers/Toolkit/Calibration_modflow/runs_calibration_pixel/final_calibrated_input_maps/Layer1_Thickness_calibrated.tif ; P:/watmodel/CWATM/model/cwatm_modflow_layers/Toolkit/Calibration_modflow/runs_calibration_pixel/final_calibrated_input_maps/Layer2_Thickness_calibrated.tif 

# Processing porosity map for ModFlow-Flopy format (default = 0.1)
poro = P:/watmodel/CWATM/model/cwatm_modflow_layers/Toolkit/Calibration_modflow/runs_calibration_pixel/final_calibrated_input_maps/Layer1_Porosity_por1_calibrated.tif ; P:/watmodel/CWATM/model/cwatm_modflow_layers/Toolkit/Calibration_modflow/runs_calibration_pixel/final_calibrated_input_maps/Layer2_Porosity_por2_calibrated.tif 
#Average porosity 2% (https://www.researchgate.net/publication/354607395_Naturally_Fractured_Basement_Reservoir_Characterization_in_a_Mature_Field)

#Processing permeability map for ModFlow-Flopy format (default = 10E-5) -- Hydraulic Conductivity (K-Sat): m/s-1
permeability = P:/watmodel/CWATM/model/cwatm_modflow_layers/Toolkit/Calibration_modflow/runs_calibration_pixel/final_calibrated_input_maps/Layer1_Horizontal_Perm_kh1_calibrated.tif ; P:/watmodel/CWATM/model/cwatm_modflow_layers/Toolkit/Calibration_modflow/runs_calibration_pixel/final_calibrated_input_maps/Layer2_Horizontal_Perm_kh2_calibrated.tif
permeability_vertical = P:/watmodel/CWATM/model/cwatm_modflow_layers/Toolkit/Calibration_modflow/runs_calibration_pixel/final_calibrated_input_maps/Layer1_Vertical_Perm_kv1_calibrated.tif ; P:/watmodel/CWATM/model/cwatm_modflow_layers/Toolkit/Calibration_modflow/runs_calibration_pixel/final_calibrated_input_maps/Layer2_Vertical_Perm_kv2_calibrated.tif 


##  --- SW-GW Interactions -----------------------
# Simulate areas with low permeability cover (e.g., not included in layer)
lowPermabilityCover = $(FILE_PATHS:PathRoot)/inputs/laterite/low_prm_layer.tif

# Dynamic River Drainage
adjust_drainage_by_river = True

# Wetland area fraction are used as minimum cell chanRatio, enhancing baseflow
wetland_fraction = $(PathGroundwaterModflowInput)/modflow_wetlandFrac.tif

#take fractured basement perm 0.01 mD horizontal and 0.001mD vertical
# leakage under lake and rivers in m/day
leakageriver_permea = 0.001
leakagelake_permea = 0.0005

##  --- Pumping & wells -----------------------
# Pumping file (a 3D numpy array where 1st dim is time, then, 1st col = ModFlow row index, 2nd col = ModFlow col index, 3rd col = pumping rates < 0 !!!! in m3/day)
Groundwater_pumping = True

# if ModFlow cells under the CWatM cell are less saturated than 1-water_table_limit_for_pumping, we prevent pumping
water_table_limit_for_pumping = 0.2

[PHOSPHORUS]
includePhosphorus = True
## make sure the units make sense
# Initial soil concentration of inactive P in a grid cell managed lands [mg P/kg soil]
fractionInactiveManaged_P = $(FILE_PATHS:PathMaps_wq)/sharInactive_Pm.nc

# Initial soil concentration of inactive P in a grid cell natural lands [mg P/kg soil]
fractionInactiveNatural_P = $(FILE_PATHS:PathMaps_wq)/sharInactive_P.nc

# Fraction of managed grassland
fracManagedGrassland = $(FILE_PATHS:PathMaps_wq)/managed_grassland.nc

# Initial soil concentration of total P [% of weight]
#soilTP1_init = 0.06
soilTP1_init = $(FILE_PATHS:PathMaps_wq)/TP_percent_4-5cm_lyr1.nc

#soilTP2_init = 0.08
soilTP2_init = $(FILE_PATHS:PathMaps_wq)/TP_percent_28-9cm_lyr2.nc

#soilTP3_init = 0.05 
soilTP3_init = $(FILE_PATHS:PathMaps_wq)/TP_percent_82-9cm_lyr3.nc

# Mineral P - backgroud concentration
background_P_mineral = $(FILE_PATHS:PathMaps_wq)/background_P_concentration.nc

# soil_shielding factor 
soil_shielding = $(FILE_PATHS:PathMaps_wq)/soil_shielding_factor.nc

# Activation energy 
activation_energy = $(FILE_PATHS:PathMaps_wq)/activation_energy.nc

# kg m-2 month
P_Cropland_Input = $(FILE_PATHS:PathMaps_wq)/P_netInput_Cropland.nc

# kg m-2 year
P_Grassland_Input = $(FILE_PATHS:PathMaps_wq)/P_netInput_Grassland.nc

shareManure_Grassland = $(FILE_PATHS:PathMaps_wq)/shareManure_Grassland.nc

#  kg day-1 | only apply where return flows are present - needs to account for share going to surfacewater somehow. e.g., the use of pits/ponds as basic wwt would encourage a groundwater infiltration
P_sourcePoint = $(FILE_PATHS:PathMaps_wq)/P_loadings_Sourcepoint_daily.nc

pitLatrinesDepth = 2

# soil absorption coefficient [mm / kg soil]
Kf = 5.1e-04
#1.1e-04

kf_water = 1.612
#1.612

# Manure application - fraction of inactive P in manure (0 -1)
f_InactiveManure = 0.1

# Fraction of manure ending up in the channelStorage (0 -1)
f_ChannelManure = 0.0085

# groundwater P concentration mg P / liter
GW_P_Conc = 0

# P atmospheric deposition [gr P m-2 year-1)
p_atm_deposition = $(FILE_PATHS:PathMaps_wq)/atm_P_depostion.nc

# runoff P coefficient - the share of first soil layer P that leak to surface runoff - should always bigger than 1
runoff_Padj = 2.5

# calibration parameter enrichment factor for PP conc in top river bed ; regulates resuspension of PP (>= 1)
resuspension_P_calibration = 0

# coefficient to control the vertical re-distribution of P in the sub-soil layers; it regulates leakage (Should be >= 1; ==1 means uniform distribution)

[EROSED]
includeErosed = True

cfactor_from_kc = True
# (M)USLE factors
kFactor = $(FILE_PATHS:PathMaps_wq)/erosed_kfactor_5min.nc
cFactor = $(FILE_PATHS:PathMaps_wq)/erosed_cfactor_5min.nc
lsFactor = $(FILE_PATHS:PathMaps_wq)/erosed_lsfactor_5min.nc

